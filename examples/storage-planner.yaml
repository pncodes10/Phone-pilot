# Storage Planner (com.storageplanner) smoke test. Read-only: it changes no files.
# Run with:  python phonectl.py run examples/storage-planner.yaml
# (pairing from PHONE_PAIRING, or pass it first: phonectl.py "bridge:https://...#TOKEN" run ...)
name: Storage Planner main screen and Algorithm Lab
app: com.storageplanner
timeout: 4            # seconds each assert_visible / assert_gone may wait
steps:
  - launch
  - assert_visible: "Storage Planner"
  - assert_visible: "Used space to reach"
  - assert_visible: {text: "Analyse my storage", exact: true}

  # the target field keeps what is typed
  - type: {text: "80", into: "Target used space in gigabytes"}
  - assert_visible: {text: "80", exact: true}
  - type: {text: "75", into: "Target used space in gigabytes"}

  # Algorithm Lab opens and comes back
  - scroll: down
  - tap: "Algorithm Lab (debug)"
  - assert_visible: "Pick pictures"
  - assert_visible: "Run everything"
  - back
  - assert_visible: "Analyse my storage"
